<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OmniHub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css?v=7.3">
  <style>
    /* 开屏关键样式（内联兜底，style.css 加载失败也能显示） */
    #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0D0E13;transition:opacity .6s cubic-bezier(.22,.8,.32,1),visibility .6s;}
    #splash.done{opacity:0;visibility:hidden;pointer-events:none;}
    #splash .splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px;animation:splashIn .7s cubic-bezier(.22,.8,.32,1) both;}
    @keyframes splashIn{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:none;}}
    #splash .splash-logo{width:88px;height:88px;border-radius:22px;overflow:hidden;box-shadow:0 8px 32px rgba(99,102,241,.35);background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);}
    #splash .splash-logo img{width:100%;height:100%;object-fit:cover;}
    #splash .splash-slogan{font-size:15px;font-weight:600;color:#A6ADC0;letter-spacing:2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
    #splash .splash-dot{color:#6366F1;font-weight:800;}
    #splash .splash-brand{font-size:13px;font-weight:700;color:#646C7E;letter-spacing:3px;text-transform:uppercase;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  </style>
</head>
<body>
<!-- ==================== 开屏页 ==================== -->
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo">
      <img src="assets/brand.jpg" alt="OmniHub">
    </div>
    <div class="splash-slogan">纵横四海<span class="splash-dot">·</span>引领无限</div>
    <div class="splash-brand">OmniHub</div>
  </div>
</div>
<script>
  /* 开屏兜底：3 秒强制淡出移除 */
  setTimeout(function() {
    var s = document.getElementById('splash');
    if (!s) return;
    s.classList.add('done');
    setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
  }, 3000);
</script>

  <!-- 页面容器 -->
  <div id="app">
    <!-- 我的模块 (默认主页) -->
    <div class="page active" id="page-profile">
      <div class="page-header">
        <h2 class="page-title">我的</h2>
      </div>
      <div class="page-body" id="profileBody"></div>
    </div>

    <!-- 阅读模块 -->
    <div class="page" id="page-read">
      <div class="page-header">
        <h2 class="page-title" id="readTitle">阅读</h2>
        <div class="page-actions">
          <button class="icon-btn" id="readSearchBtn"><span data-icon="search"></span></button>
          <button class="icon-btn" id="readSettingsBtn"><span data-icon="settings"></span></button>
        </div>
      </div>
      <div class="page-body" id="readBody"></div>
    </div>

    <!-- 对话模块 -->
    <div class="page" id="page-chat">
      <div class="page-body" id="chatBody"></div>
    </div>
  </div>

  <!-- 悬浮球导航 -->
  <div id="fabNav" class="fab-nav">
    <div class="fab-mask" id="fabMask"></div>
    <div class="fab-menu" id="fabMenu">
      <div class="fab-menu-pages" id="fabMenuPages"></div>
      <div class="fab-menu-dots" id="fabMenuDots"></div>
      <button class="fab-menu-close" id="fabMenuClose">✕</button>
    </div>
    <button class="fab-trigger" id="fabTrigger">
      <span class="fab-icon" id="fabIcon">⌂</span>
    </button>
  </div>

  <!-- 阅读器 (全屏覆盖) -->
  <div id="readerOverlay" class="reader-overlay hidden">
    <div id="readerTopbar" class="reader-topbar">
      <button id="readerBack">←</button>
      <span id="readerTitle">阅读</span>
      <button id="readerMenu">⋮</button>
    </div>
    <div id="readerContent"></div>
    <div id="readerBottombar" class="reader-bottombar">
      <div class="reader-bottom-inner">
        <button id="readerPrevCh">上一章</button>
        <input type="range" id="readerPageSlider" min="1" max="100" value="1">
        <span id="readerPageIndicator">1 / 1</span>
        <button id="readerNextCh">下一章</button>
      </div>
    </div>
    <div id="readerFloat">
      <button class="reader-float-btn" id="readerChBtn" title="章节">☰</button>
      <button class="reader-float-btn" id="readerSetBtn" title="设置">⚙</button>
    </div>
    <div id="readerChapterPanel" class="reader-panel">
      <div class="reader-panel-head">
        <span>章节列表</span>
        <button class="reader-panel-close" id="readerChClose">✕</button>
      </div>
      <div id="readerChapterList"></div>
    </div>
    <div id="readerSettingsPanel" class="reader-panel">
      <div class="reader-panel-head">
        <span>阅读设置</span>
        <button class="reader-panel-close" id="readerSetClose">✕</button>
      </div>
      <div class="reader-settings-body">
        <div class="reader-settings-section">
          <div class="reader-settings-label">阅读模式</div>
          <div class="reader-mode-grid">
            <button class="reader-mode-option active" data-mode="gallery-rtl">日漫翻页<br><small>右→左</small></button>
            <button class="reader-mode-option" data-mode="gallery-ltr">国漫翻页<br><small>左→右</small></button>
            <button class="reader-mode-option" data-mode="continuous-ttb">连续滚动<br><small>条漫</small></button>
          </div>
        </div>
      </div>
    </div>
    <div id="readerLoading" class="hidden">
      <div class="reader-spinner"></div>
      <span>加载中…</span>
    </div>
    <div id="readerError" class="hidden">
      <span id="readerErrorText">加载失败</span>
      <button id="readerRetryBtn">重试</button>
    </div>
  </div>

  <!-- 小说阅读器 (全屏覆盖) -->
  <div id="novelReaderOverlay" class="reader-overlay hidden">
    <div id="novelReaderTopbar" class="reader-topbar">
      <button id="novelReaderBack">←</button>
      <span id="novelReaderTitle">小说</span>
      <button id="novelReaderMenu">⋮</button>
    </div>
    <div id="novelReaderContent" class="novel-content"></div>
    <div id="novelReaderBottombar" class="reader-bottombar">
      <div class="reader-bottom-inner">
        <button id="novelReaderPrevCh">上一章</button>
        <span id="novelReaderPageIndicator">第1章</span>
        <button id="novelReaderNextCh">下一章</button>
      </div>
    </div>
    <div id="novelReaderFloat">
      <button class="reader-float-btn" id="novelReaderChBtn" title="目录">☰</button>
      <button class="reader-float-btn" id="novelReaderSetBtn" title="设置">⚙</button>
    </div>
    <div id="novelReaderChapterPanel" class="reader-panel">
      <div class="reader-panel-head">
        <span>目录</span>
        <button class="reader-panel-close" id="novelReaderChClose">✕</button>
      </div>
      <div id="novelReaderChapterList"></div>
    </div>
    <div id="novelReaderSettingsPanel" class="reader-panel">
      <div class="reader-panel-head">
        <span>阅读设置</span>
        <button class="reader-panel-close" id="novelReaderSetClose">✕</button>
      </div>
      <div class="reader-settings-body">
        <div class="reader-settings-section">
          <div class="reader-settings-label">字体大小</div>
          <input type="range" id="novelFontSizeSlider" min="12" max="32" value="16" style="width:100%;">
        </div>
        <div class="reader-settings-section">
          <div class="reader-settings-label">行间距</div>
          <input type="range" id="novelLineHeightSlider" min="1" max="3" step="0.1" value="1.6" style="width:100%;">
        </div>
        <div class="reader-settings-section">
          <div class="reader-settings-label">背景</div>
          <div class="reader-mode-grid">
            <button class="reader-mode-option active" data-bg="dark">夜间</button>
            <button class="reader-mode-option" data-bg="parchment">羊皮纸</button>
            <button class="reader-mode-option" data-bg="green">护眼</button>
            <button class="reader-mode-option" data-bg="white">纯白</button>
          </div>
        </div>
      </div>
    </div>
    <div id="novelReaderLoading" class="hidden">
      <div class="reader-spinner"></div>
      <span>加载中…</span>
    </div>
  </div>

  <!-- 子页面：搜索 -->
  <div class="subpage" id="subReadSearch">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>搜索</h3>
    </div>
    <div class="subpage-body">
      <div class="search-bar">
        <input type="text" id="readSearchInput" placeholder="搜索小说或漫画...">
        <button id="readSearchSubmit">搜索</button>
      </div>
      <div class="source-tabs" id="readSearchTabs">
        <button class="source-tab active" data-type="all">全部</button>
        <button class="source-tab" data-type="novel">小说</button>
        <button class="source-tab" data-type="comic">漫画</button>
      </div>
      <div id="readSearchResults"></div>
    </div>
  </div>

  <!-- 子页面：书源管理 -->
  <div class="subpage" id="subReadSources">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>书源管理</h3>
    </div>
    <div class="subpage-body">
      <div class="source-import-box">
        <textarea id="sourceImportInput" placeholder="粘贴书源：支持 Legado JSON（单个或合集）、Venera JS 图源脚本、CSS 选择器配置，自动识别格式"></textarea>
        <button id="sourceImportBtn">导入书源</button>
      </div>
      <div id="sourceList"></div>
    </div>
  </div>

  <!-- 子页面：阅读设置 -->
  <div class="subpage" id="subReadSettings">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>阅读设置</h3>
    </div>
    <div class="subpage-body" id="readSettingsBody"></div>
  </div>

  <!-- 子页面：模块管理 -->
  <div class="subpage" id="subModuleManage">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>模块管理</h3>
    </div>
    <div class="subpage-body" id="moduleManageBody"></div>
  </div>

  <!-- 子页面：会员中心 -->
  <div class="subpage" id="subMemberCenter">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>会员中心</h3>
    </div>
    <div class="subpage-body" id="memberCenterBody"></div>
  </div>

  <!-- 子页面：全局设置 -->
  <div class="subpage" id="subGlobalSettings">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>设置</h3>
    </div>
    <div class="subpage-body" id="globalSettingsBody"></div>
  </div>

  <!-- 子页面：数据管理 -->
  <div class="subpage" id="subDataManage">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>数据管理</h3>
    </div>
    <div class="subpage-body" id="dataManageBody"></div>
  </div>

  <!-- 子页面：对话历史 -->
  <div class="subpage" id="subChatHistory">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>对话历史</h3>
    </div>
    <div class="subpage-body" id="chatHistoryBody"></div>
  </div>

  <!-- 子页面：选择模型 -->
  <div class="subpage" id="subChatModel">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>选择模型</h3>
    </div>
    <div class="subpage-body" id="chatModelBody"></div>
  </div>

  <!-- 子页面：对话设置 -->
  <div class="subpage" id="subChatSettings">
    <div class="subpage-header">
      <button class="back-btn" data-close-sub><span data-icon="arrow-left"></span></button>
      <h3>对话设置</h3>
    </div>
    <div class="subpage-body" id="chatSettingsBody"></div>
  </div>

  <!-- 加载层 -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/store.js?v=7.3"></script>
  <script src="js/legado-engine.js?v=7.3"></script>
  <script src="js/source-detect.js?v=7.3"></script>
  <script src="js/ai-providers.js?v=7.3"></script>
  <script src="js/ai-api.js?v=7.3"></script>
  <script src="js/venera-engine.js?v=7.3"></script>
  <script src="js/modules/nav.js?v=7.3"></script>
  <script src="js/modules/reader.js?v=7.3"></script>
  <script src="js/modules/novel-reader.js?v=7.3"></script>
  <script src="js/modules/profile.js?v=7.3"></script>
  <script src="js/modules/chat.js?v=7.3"></script>
  <script src="js/modules/read.js?v=7.3"></script>
  <script src="js/app.js?v=7.3"></script>
</body>
</html>
